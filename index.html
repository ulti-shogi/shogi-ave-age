<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四段昇段時平均年齢</title>
    <style>
        /* 共通スタイル */
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            padding: 10px; 
            line-height: 1.4; 
            background-color: #f0f2f5;
            margin: 0;
            color: #333;
        }
        
        /* 上部の情報エリア */
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto; /* 中央寄せ */
            background: #fff;
            padding: 15px; /* 内側の余白 */
            border-radius: 8px;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { 
            font-size: 1.2em; 
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 8px;
            margin-top: 0;
        }
        #result { 
            font-size: 1.4em; 
            font-weight: bold; 
            color: #d35400; 
            margin: 15px 0; 
            text-align: center;
            background: #fff3e0;
            padding: 10px;
            border-radius: 6px;
        }
        .controls {
            display: flex;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background-color: #2c3e50;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background-color: #1a252f;
        }

        /* テーブルエリア（コンテナの外側に出し、余白をなくして広く使う） */
        .table-wrapper {
            width: 100%;
            max-width: 900px; /* 上のコンテナと幅を合わせる */
            margin: 15px auto 0; /* 中央寄せ ＋ 上に15pxの隙間 */
            box-sizing: border-box;
            background: #fff;
            border-radius: 8px;
            overflow: hidden; /* 角丸からはみ出ないように */
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            font-size: 0.95em; 
        }
        th, td { 
            border: 1px solid #cbd5e1; 
            padding: 12px 4px;
            text-align: center; 
            word-break: break-word;
        }
        th { 
            background-color: #2c3e50;
            color: white; 
        }
        th select {
            width: 95%;
            padding: 6px 2px;
            font-size: 16px; 
            background-color: #f8f9fa;
            color: #333;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        tr:nth-child(even) {
            background-color: #f8fafc;
        }
        tr:hover {
            background-color: #e2e8f0;
        }
        
        .no-col { width: 15%; color: #64748b; font-weight: bold; }
        .name-col { font-weight: bold; width: 35%; }
        .data-col { width: 50%; }
    </style>
</head>
<body>

    <!-- 上部のコンテナ（タイトル、結果、ボタン） -->
    <div class="container">
        <h1>四段昇段時 平均年齢 (番号184〜)</h1>
        <div id="result">計算中...</div>
        <div class="controls">
            <button id="sortOrderBtn">昇段年齢 の 昇順 ▲</button>
        </div>
    </div>

    <!-- テーブル用のコンテナ（外に出した部分） -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th class="no-col">No.</th>
                    <th class="name-col">棋士名</th>
                    <th class="data-col">
                        <select id="col3Select">
                            <option value="age" selected>四段昇段年齢</option>
                            <option value="fourth">四段昇段日</option>
                            <option value="birthday">生年月日</option>
                            <option value="num">棋士番号</option>
                        </select>
                    </th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Javascriptでデータが挿入されます -->
            </tbody>
        </table>
    </div>

    <script>
        let allData = [];
        let isAsc = true; 

        fetch('kishi-data.txt')
            .then(response => {
                if (!response.ok) throw new Error('データ読み込み失敗');
                return response.text();
            })
            .then(csvText => {
                const lines = csvText.replace(/\r/g, '').split('\n').filter(line => line.trim() !== '');
                
                let totalDays = 0;
                let count = 0;

                for (let i = 1; i < lines.length; i++) {
                    const row = lines[i].split(',');
                    if (row.length < 4) continue;

                    let num = parseInt(row[0], 10);
                    let name = row[1];
                    let birthdayStr = row[2];
                    let fourStr = row[3];

                    if (num >= 184 && birthdayStr && fourStr) {
                        let birth = new Date(birthdayStr);
                        let four = new Date(fourStr);
                        
                        if (!isNaN(birth.getTime()) && !isNaN(four.getTime())) {
                            let diffDays = (four.getTime() - birth.getTime()) / (1000 * 60 * 60 * 24);
                            totalDays += diffDays;
                            count++;

                            let y = four.getFullYear() - birth.getFullYear();
                            let m = four.getMonth() - birth.getMonth();
                            let d = four.getDate() - birth.getDate();
                            
                            if (d < 0) {
                                m--;
                                let prevMonth = new Date(four.getFullYear(), four.getMonth(), 0); 
                                d += prevMonth.getDate();
                            }
                            if (m < 0) {
                                y--;
                                m += 12;
                            }
                            
                            let ageText = `${y}歳${m}ヶ月${d}日`;

                            allData.push({
                                num: num,
                                name: name,
                                birthdayStr: birthdayStr,
                                fourStr: fourStr,
                                ageText: ageText,
                                diffDays: diffDays,      
                                birthTime: birth.getTime(), 
                                fourTime: four.getTime()    
                            });
                        }
                    }
                }

                if (count > 0) {
                    let averageDays = totalDays / count;
                    document.getElementById('result').textContent = `平均: ` + daysToYMD(averageDays);
                } else {
                    document.getElementById('result').textContent = "-";
                }

                renderTable();
            })
            .catch(error => {
                console.error(error);
                document.getElementById('result').textContent = "エラー";
            });

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const col3Select = document.getElementById('col3Select');
            const col3Key = col3Select.value;
            const col3Text = col3Select.options[col3Select.selectedIndex].text;

            const btn = document.getElementById('sortOrderBtn');
            btn.textContent = `${col3Text} の ${isAsc ? '昇順 ▲' : '降順 ▼'}`;

            allData.sort((a, b) => {
                let cmp = 0;
                if (col3Key === 'num') {
                    cmp = a.num - b.num;
                } else if (col3Key === 'age') {
                    cmp = a.diffDays - b.diffDays;
                } else if (col3Key === 'birthday') {
                    cmp = a.birthTime - b.birthTime;
                } else if (col3Key === 'fourth') {
                    cmp = a.fourTime - b.fourTime;
                }
                return isAsc ? cmp : -cmp;
            });

            tbody.innerHTML = '';

            allData.forEach((data, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="no-col">${index + 1}</td>
                    <td class="name-col">${data.name}</td>
                    <td class="data-col">${getColValue(col3Key, data)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getColValue(key, data) {
            if (key === 'birthday') return data.birthdayStr;
            if (key === 'fourth') return data.fourStr;
            if (key === 'age') return data.ageText;
            if (key === 'num') return data.num;
            return '';
        }

        function daysToYMD(totalDays) {
            let y = Math.floor(totalDays / 365.2425);
            let rem = totalDays % 365.2425;
            let m = Math.floor(rem / 30.436875);
            let d = Math.floor(rem % 30.436875);
            return `${y}歳${m}ヶ月${d}日`;
        }
        
        document.getElementById('sortOrderBtn').addEventListener('click', function() {
            isAsc = !isAsc;
            renderTable();
        });

        document.getElementById('col3Select').addEventListener('change', function() {
            isAsc = true; 
            renderTable();
        });
    </script>
</body>
</html>
