<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四段昇段時平均年齢（棋士番号184以降）</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            padding: 20px; 
            line-height: 1.6; 
            background-color: #f9f9f9;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { 
            font-size: 1.5em; 
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
        }
        #result { 
            font-size: 2.5em; 
            font-weight: bold; 
            color: #d35400; 
            margin: 20px 0; 
            text-align: center;
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            margin-top: 30px; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 10px; 
            text-align: center; 
        }
        th { 
            background-color: #2c3e50;
            color: white; 
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #e9f7ef;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>奨励会三段リーグ開始以降（棋士番号184以降）の四段昇段時 平均年齢</h1>
        <div id="result">計算中...</div>
        
        <table>
            <thead>
                <tr>
                    <th>棋士番号</th>
                    <th>名前</th>
                    <th>生年月日</th>
                    <th>四段昇段日</th>
                    <th>昇段時年齢</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Javascriptでデータが挿入されます -->
            </tbody>
        </table>
    </div>

    <script>
        fetch('kishi-data.txt')
            .then(response => {
                if (!response.ok) throw new Error('データ読み込み失敗');
                return response.text();
            })
            .then(csvText => {
                // average.js と同じパース処理
                const lines = csvText.replace(/\r/g, '').split('\n').filter(line => line.trim() !== '');
                const tbody = document.getElementById('table-body');
                
                let totalDays = 0;
                let count = 0;

                for (let i = 1; i < lines.length; i++) {
                    const row = lines[i].split(',');
                    if (row.length < 4) continue;

                    let num = parseInt(row[0], 10);
                    let name = row[1];
                    let birthdayStr = row[2];
                    let fourStr = row[3];

                    // 棋士番号184以降で、データが存在する人のみ対象
                    if (num >= 184 && birthdayStr && fourStr) {
                        let birth = new Date(birthdayStr);
                        let four = new Date(fourStr);
                        
                        if (!isNaN(birth.getTime()) && !isNaN(four.getTime())) {
                            // 【1. 平均計算用の正確な日数（ミリ秒計算）】
                            let diffDays = (four.getTime() - birth.getTime()) / (1000 * 60 * 60 * 24);
                            totalDays += diffDays;
                            count++;

                            // 【2. 個人の年齢表示用のカレンダー計算（average.jsと同一）】
                            let y = four.getFullYear() - birth.getFullYear();
                            let m = four.getMonth() - birth.getMonth();
                            let d = four.getDate() - birth.getDate();
                            
                            if (d < 0) {
                                m--;
                                let prevMonth = new Date(four.getFullYear(), four.getMonth(), 0); 
                                d += prevMonth.getDate();
                            }
                            if (m < 0) {
                                y--;
                                m += 12;
                            }
                            
                            let ageText = `${y}歳${m}ヶ月${d}日`;

                            // テーブルに行を追加
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${num}</td>
                                <td>${name}</td>
                                <td>${birthdayStr}</td>
                                <td>${fourStr}</td>
                                <td>${ageText}</td>
                            `;
                            tbody.appendChild(tr);
                        }
                    }
                }

                // 【3. 平均年齢の計算と表示】
                if (count > 0) {
                    let averageDays = totalDays / count;
                    document.getElementById('result').textContent = `平均: ` + daysToYMD(averageDays);
                } else {
                    document.getElementById('result').textContent = "-";
                }
            })
            .catch(error => {
                console.error(error);
                document.getElementById('result').textContent = "エラー";
            });

        // 【平均値用の変換関数（average.jsと同一）】
        function daysToYMD(totalDays) {
            let y = Math.floor(totalDays / 365.2425);
            let rem = totalDays % 365.2425;
            let m = Math.floor(rem / 30.436875);
            let d = Math.floor(rem % 30.436875);
            return `${y}歳${m}ヶ月${d}日`;
        }
    </script>
</body>
</html>
