<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>将棋の殿堂</title>
    <!-- CSSファイルを読み込む -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="color.css"> <!-- ←追加：色設定用のCSS -->
</head><!--←head-->
<body>

    <h1>将棋の殿堂</h1>

    <div class="container">
        <div id="output">データを計算中です...</div><!--←#output-->
    </div><!--←.container-->

    <table>
        <thead>
            <tr>
                <th></th>
                <th>棋士名 <br><button class="sort-btn" data-col="name" data-order="none">▲▼</button></th>
                <th>四段昇段年齢 <br><button class="sort-btn" data-col="age" data-order="none">▲▼</button></th>
                <th>棋士番号 <br><button class="sort-btn" data-col="num" data-order="asc">▲</button></th>
            </tr><!--←tr-->
        </thead><!--←thead-->
        <tbody id="table-body">
            <!-- ここにJavaScriptでテーブルの中身が挿入されます -->
        </tbody><!--←#table-body-->
    </table><!--←table-->

    <!-- JavaScriptファイルを読み込む -->
    <script src="script.js"></script>
</body><!--←body-->
</html><!--←html-->
