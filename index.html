<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四段昇段時平均年齢</title>
    <style>
        /* 共通スタイル */
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            padding: 10px; 
            line-height: 1.4; 
            background-color: #f0f2f5;
            margin: 0;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 15px; 
            border-radius: 8px;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { 
            font-size: 1.2em; 
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 8px;
            margin-top: 0;
        }
        #result { 
            font-size: 1.4em; 
            font-weight: bold; 
            color: #d35400; 
            margin: 15px 0; 
            text-align: center;
            background: #fff3e0;
            padding: 10px;
            border-radius: 6px;
        }

        /* コントロールパネル（ソートスイッチ等） */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            align-items: center;
        }
        .controls label {
            font-size: 0.9em;
            font-weight: bold;
        }
        select, button {
            padding: 8px;
            font-size: 16px; /* iOSのズーム防止のため16px以上 */
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
        }
        button {
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            flex-grow: 1; /* スマホで押しやすいように広げる */
        }
        button:active {
            background-color: #1a252f;
        }

        /* テーブルのスタイル（大きく見やすく） */
        .table-wrapper {
            overflow-x: auto; /* はみ出した場合はスクロール */
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            font-size: 0.95em; 
            min-width: 400px; /* 小さくなりすぎるのを防止 */
        }
        th, td { 
            border: 1px solid #cbd5e1; 
            padding: 12px 6px; /* タップしやすく上下の余白を大きく */
            text-align: center; 
            word-break: break-word;
        }
        th { 
            background-color: #2c3e50;
            color: white; 
        }
        /* テーブル内のプルダウン */
        th select {
            width: 100%;
            padding: 4px;
            font-size: 0.9em;
            margin-top: 4px;
            background-color: #f8f9fa;
            color: #333;
        }
        tr:nth-child(even) {
            background-color: #f8fafc;
        }
        tr:hover {
            background-color: #e2e8f0;
        }
        .no-col {
            width: 30px;
            color: #64748b;
            font-weight: bold;
        }
        .name-col {
            font-weight: bold;
            width: 25%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>四段昇段時 平均年齢 (番号184〜)</h1>
        <div id="result">計算中...</div>

        <!-- ソートを切り替えるスイッチ群 -->
        <div class="controls">
            <label for="sortKey">並び替え:</label>
            <select id="sortKey">
                <option value="num">棋士番号</option>
                <option value="age">昇段年齢</option>
                <option value="fourth">四段昇段日</option>
                <option value="birthday">生年月日</option>
            </select>
            <button id="sortOrderBtn">昇順 ▲</button>
        </div>
        
        <!-- 4列のテーブル -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>棋士名</th>
                        <th>
                            <select id="col3Select">
                                <option value="birthday">生年月日</option>
                                <option value="fourth">四段昇段日</option>
                                <option value="age" selected>四段昇段年齢</option>
                                <option value="num">棋士番号</option>
                            </select>
                        </th>
                        <th>
                            <select id="col4Select">
                                <option value="birthday">生年月日</option>
                                <option value="fourth" selected>四段昇段日</option>
                                <option value="age">四段昇段年齢</option>
                                <option value="num">棋士番号</option>
                            </select>
                        </th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Javascriptでデータが挿入されます -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allData = [];
        let isAsc = true; // 昇順・降順のフラグ

        // データ読み込み
        fetch('kishi-data.txt')
            .then(response => {
                if (!response.ok) throw new Error('データ読み込み失敗');
                return response.text();
            })
            .then(csvText => {
                const lines = csvText.replace(/\r/g, '').split('\n').filter(line => line.trim() !== '');
                
                let totalDays = 0;
                let count = 0;

                for (let i = 1; i < lines.length; i++) {
                    const row = lines[i].split(',');
                    if (row.length < 4) continue;

                    let num = parseInt(row[0], 10);
                    let name = row[1];
                    let birthdayStr = row[2];
                    let fourStr = row[3];

                    // 対象の絞り込み
                    if (num >= 184 && birthdayStr && fourStr) {
                        let birth = new Date(birthdayStr);
                        let four = new Date(fourStr);
                        
                        if (!isNaN(birth.getTime()) && !isNaN(four.getTime())) {
                            let diffDays = (four.getTime() - birth.getTime()) / (1000 * 60 * 60 * 24);
                            totalDays += diffDays;
                            count++;

                            // カレンダー計算での年齢文字列
                            let y = four.getFullYear() - birth.getFullYear();
                            let m = four.getMonth() - birth.getMonth();
                            let d = four.getDate() - birth.getDate();
                            
                            if (d < 0) {
                                m--;
                                let prevMonth = new Date(four.getFullYear(), four.getMonth(), 0); 
                                d += prevMonth.getDate();
                            }
                            if (m < 0) {
                                y--;
                                m += 12;
                            }
                            
                            let ageText = `${y}歳${m}ヶ月${d}日`;

                            // 配列にオブジェクトとして保存
                            allData.push({
                                num: num,
                                name: name,
                                birthdayStr: birthdayStr,
                                fourStr: fourStr,
                                ageText: ageText,
                                diffDays: diffDays,      // 年齢ソート用
                                birthTime: birth.getTime(), // 誕生日ソート用
                                fourTime: four.getTime()    // 昇段日ソート用
                            });
                        }
                    }
                }

                // 平均の表示
                if (count > 0) {
                    let averageDays = totalDays / count;
                    document.getElementById('result').textContent = `平均: ` + daysToYMD(averageDays);
                } else {
                    document.getElementById('result').textContent = "-";
                }

                // テーブルの初回描画
                renderTable();
            })
            .catch(error => {
                console.error(error);
                document.getElementById('result').textContent = "エラー";
            });

        // テーブルの描画関数
        function renderTable() {
            const tbody = document.getElementById('table-body');
            const sortKey = document.getElementById('sortKey').value;
            const col3Key = document.getElementById('col3Select').value;
            const col4Key = document.getElementById('col4Select').value;

            // データの並び替え（ソート）
            allData.sort((a, b) => {
                let cmp = 0;
                if (sortKey === 'num') {
                    cmp = a.num - b.num;
                } else if (sortKey === 'age') {
                    cmp = a.diffDays - b.diffDays;
                } else if (sortKey === 'birthday') {
                    cmp = a.birthTime - b.birthTime;
                } else if (sortKey === 'fourth') {
                    cmp = a.fourTime - b.fourTime;
                }
                
                // 昇順・降順の適用
                return isAsc ? cmp : -cmp;
            });

            // テーブルの中身を一度リセット
            tbody.innerHTML = '';

            // 描画
            allData.forEach((data, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="no-col">${index + 1}</td>
                    <td class="name-col">${data.name}</td>
                    <td>${getColValue(col3Key, data)}</td>
                    <td>${getColValue(col4Key, data)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // キーに応じたセルの値を取得する関数
        function getColValue(key, data) {
            if (key === 'birthday') return data.birthdayStr;
            if (key === 'fourth') return data.fourStr;
            if (key === 'age') return data.ageText;
            if (key === 'num') return data.num;
            return '';
        }

        // 平均値用の変換関数
        function daysToYMD(totalDays) {
            let y = Math.floor(totalDays / 365.2425);
            let rem = totalDays % 365.2425;
            let m = Math.floor(rem / 30.436875);
            let d = Math.floor(rem % 30.436875);
            return `${y}歳${m}ヶ月${d}日`;
        }

        /* --- イベントリスナー（操作時の動作設定） --- */
        
        // ソート順（昇順/降順）切り替えボタン
        document.getElementById('sortOrderBtn').addEventListener('click', function() {
            isAsc = !isAsc;
            this.textContent = isAsc ? '昇順 ▲' : '降順 ▼';
            renderTable();
        });

        // プルダウン変更時にテーブルを再描画
        document.getElementById('sortKey').addEventListener('change', renderTable);
        document.getElementById('col3Select').addEventListener('change', renderTable);
        document.getElementById('col4Select').addEventListener('change', renderTable);

    </script>
</body>
</html>
